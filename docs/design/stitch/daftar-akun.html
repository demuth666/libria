<body class="min-h-screen flex items-center justify-center p-0 sm:p-4 bg-surface">
<!-- BEGIN: Mobile Device Frame Simulator -->
<main class="w-full max-w-[393px] h-screen sm:h-[844px] bg-surface sm:rounded-[44px] shadow-2xl overflow-y-auto flex flex-col justify-between relative border border-outline-variant/40" data-purpose="mobile-viewport">
<div class="flex flex-col w-full px-5 py-6 space-y-6">
<!-- Brand & Welcome Section -->
<header class="flex flex-col items-center text-center space-y-3 pt-2">
<div class="w-14 h-14 rounded-2xl bg-primary flex items-center justify-center shadow-lg transform -rotate-1 hover:rotate-0 transition-transform duration-300">
<div class="w-11 h-11 rounded-xl bg-primary-container flex items-center justify-center border-t border-secondary-container/20">
<span class="font-serif text-secondary-fixed text-2xl font-bold select-none tracking-tighter">L</span>
</div>
</div>
<div class="space-y-1">
<h1 class="font-serif text-headline-xl-mobile text-on-surface">Buat Akun Baru</h1>
<p class="font-sans text-body-sm text-on-surface-variant max-w-[280px] mx-auto leading-relaxed">
        Bergabung dengan komunitas pembaca Libria dan mulai perjalanan literasimu.
      </p>
</div>
</header>
<!-- Registration Card Container -->
<div class="bg-surface-container-lowest rounded-3xl p-5 shadow-card border border-outline-variant/30 space-y-4">
<form class="space-y-3.5" id="registerForm" onsubmit="event.preventDefault();">
<!-- Field: Nama Lengkap -->
<div class="space-y-1">
<label class="block font-sans text-label-md text-on-surface font-medium" for="fullName">
          Nama Lengkap
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[19px] pointer-events-none">
            person
          </span>
<input class="w-full bg-surface-container-low pl-10 pr-3.5 py-3 rounded-xl font-sans text-body-md text-on-surface placeholder:text-outline/70 border border-outline-variant/50 focus:border-secondary focus:ring-2 focus:ring-secondary/20 focus:bg-surface-container-lowest transition-all duration-200" id="fullName" name="fullName" placeholder="Siti Nurhaliza" required="" type="text"/>
</div>
</div>
<!-- Field: Email -->
<div class="space-y-1">
<label class="block font-sans text-label-md text-on-surface font-medium" for="email">
          Email
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[19px] pointer-events-none">
            mail
          </span>
<input class="w-full bg-surface-container-low pl-10 pr-3.5 py-3 rounded-xl font-sans text-body-md text-on-surface placeholder:text-outline/70 border border-outline-variant/50 focus:border-secondary focus:ring-2 focus:ring-secondary/20 focus:bg-surface-container-lowest transition-all duration-200" id="email" name="email" placeholder="siti@nurhaliza.com" required="" type="email"/>
</div>
</div>
<!-- Field: Kata Sandi -->
<div class="space-y-1">
<label class="block font-sans text-label-md text-on-surface font-medium" for="password">
          Kata Sandi
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[19px] pointer-events-none">
            lock
          </span>
<input class="w-full bg-surface-container-low pl-10 pr-11 py-3 rounded-xl font-sans text-body-md text-on-surface placeholder:text-outline/70 border border-outline-variant/50 focus:border-secondary focus:ring-2 focus:ring-secondary/20 focus:bg-surface-container-lowest transition-all duration-200" id="password" name="password" placeholder="Minimal 8 karakter" required="" type="password"/>
<button aria-label="Tampilkan atau sembunyikan kata sandi" class="absolute right-3.5 p-1 text-outline hover:text-on-surface focus:outline-none transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Field: Konfirmasi Kata Sandi -->
<div class="space-y-1">
<label class="block font-sans text-label-md text-on-surface font-medium" for="confirmPassword">
          Konfirmasi Kata Sandi
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[19px] pointer-events-none">
            verified_user
          </span>
<input class="w-full bg-surface-container-low pl-10 pr-11 py-3 rounded-xl font-sans text-body-md text-on-surface placeholder:text-outline/70 border border-outline-variant/50 focus:border-secondary focus:ring-2 focus:ring-secondary/20 focus:bg-surface-container-lowest transition-all duration-200" id="confirmPassword" name="confirmPassword" placeholder="Ulangi kata sandi" required="" type="password"/>
<button aria-label="Tampilkan atau sembunyikan konfirmasi kata sandi" class="absolute right-3.5 p-1 text-outline hover:text-on-surface focus:outline-none transition-colors" id="toggleConfirmPassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeConfirmIcon">visibility</span>
</button>
</div>
</div>
<!-- Terms & Agreement Checkbox -->
<div class="pt-1">
<label class="flex items-start gap-2.5 cursor-pointer group">
<div class="relative flex items-center justify-center mt-0.5">
<input checked="" class="w-4 h-4 rounded text-secondary focus:ring-secondary/30 focus:ring-offset-0 cursor-pointer bg-surface-container-low border border-outline-variant transition-colors" id="agreeTerms" name="agreeTerms" required="" type="checkbox"/>
</div>
<span class="font-sans text-body-sm text-on-surface-variant leading-tight select-none">
            Saya menyetujui 
            <a class="text-secondary font-medium hover:underline" href="javascript:void(0)">Syarat &amp; Ketentuan</a> 
            serta 
            <a class="text-secondary font-medium hover:underline" href="javascript:void(0)">Kebijakan Privasi</a> 
            Libria.
          </span>
</label>
</div>
<!-- Submit CTA Button -->
<div class="pt-2">
<button class="w-full bg-primary hover:bg-primary-container active:scale-[0.99] text-on-primary py-3.5 rounded-xl font-sans text-label-lg font-semibold tracking-wide uppercase shadow-btn flex items-center justify-center gap-2 transition-all duration-150" id="btnSubmit" type="submit">
<span>Daftar Sekarang</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>

</form>
<!-- Social Registration Divider -->
<div class="relative py-2 flex items-center justify-center">
<div class="w-full h-px bg-surface-container-high"></div>
<span class="absolute bg-surface-container-lowest px-3 font-sans text-label-sm text-outline">
        Atau daftar dengan
      </span>
</div>
<!-- Google Quick Signup Action -->
<div>
<button class="w-full bg-surface-container-lowest hover:bg-surface-container-low text-on-surface py-3 px-4 rounded-xl font-sans text-label-md border border-outline-variant/60 flex items-center justify-center gap-3 transition-colors active:scale-[0.99] shadow-sm" type="button">
<svg aria-hidden="true" class="w-4 h-4 flex-shrink-0" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
<span>Daftar dengan Google</span>
</button>
</div>
</div>
<!-- Literary Quote / Community Teaser -->
<div class="px-3 py-2 text-center">
<p class="font-serif text-[13px] italic text-on-surface-variant font-light">
      “Membaca adalah jendela menuju ribuan kehidupan yang belum sempat dijalani.”
    </p>
</div>
<!-- Back to Login Navigation Footer -->
<footer class="text-center pb-2">
<p class="font-sans text-body-md text-on-surface-variant">
      Sudah punya akun?
      <a class="text-secondary font-semibold hover:underline ml-1" href="javascript:void(0)">
        Masuk
      </a>
</p>
</footer>
</div>
<script>
  (function() {
    function setupToggle(buttonId, inputId, iconId) {
      const btn = document.getElementById(buttonId);
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      
      if (!btn || !input || !icon) return;

      btn.addEventListener('click', function() {
        const isPassword = input.getAttribute('type') === 'password';
        input.setAttribute('type', isPassword ? 'text' : 'password');
        icon.textContent = isPassword ? 'visibility_off' : 'visibility';
        btn.classList.toggle('text-secondary', isPassword);
        btn.classList.toggle('text-outline', !isPassword);
      });
    }

    setupToggle('togglePassword', 'password', 'eyeIcon');
    setupToggle('toggleConfirmPassword', 'confirmPassword', 'eyeConfirmIcon');
  })();
</script></main>
<!-- END: Mobile Device Frame Simulator -->
</body></html>
