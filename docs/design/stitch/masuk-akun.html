0 inset-x-0 z-50 bg-surface/85 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.03)]"></header><main class="flex-1 flex flex-col relative w-full px-margin pt-16 pb-safe bg-gradient-to-b from-surface via-surface-bright to-surface-container-low"><div class="flex flex-col w-full pb-8">
<div class="flex flex-col items-center text-center mt-2 mb-6">
<div class="relative mb-3 flex items-center justify-center">
<div class="w-16 h-16 rounded-2xl bg-primary flex items-center justify-center shadow-lg shadow-primary/15 relative overflow-hidden">
<div class="absolute -right-3 -top-3 w-8 h-8 rounded-full bg-secondary-fixed opacity-40 blur-xs"></div>
<div class="absolute -left-3 -bottom-3 w-8 h-8 rounded-full bg-secondary opacity-30"></div>
<span class="font-headline-xl text-surface-container-lowest italic text-[34px] leading-none select-none z-10">L</span>
</div>
<div class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-secondary-container flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-secondary-container text-[14px]">auto_stories</span>
</div>
</div>

<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">Selamat Datang Kembali</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-xs mt-1.5 leading-relaxed">
      Masuk untuk melanjutkan petualangan membacamu dan membuka catatan refleksi pribadimu.
    </p>
</div>
<div class="w-full bg-surface-container-lowest rounded-2xl shadow-[0_4px_24px_-2px_rgba(0,32,69,0.06)] p-5 mb-5 transition-all">
<form class="flex flex-col gap-4" id="loginForm" onsubmit="event.preventDefault(); handleLoginSubmit();">
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="identifier">Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px] pointer-events-none transition-colors">mail</span>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md rounded-xl pl-11 pr-4 py-3 outline-none placeholder:text-outline-variant focus:bg-surface-container transition-all" id="identifier" placeholder="nama@email.com" required="" type="text" value="siti.nurhaliza@libria.id">
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="password">Kata Sandi</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px] pointer-events-none">lock</span>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md rounded-xl pl-11 pr-11 py-3 outline-none placeholder:text-outline-variant focus:bg-surface-container transition-all" id="password" placeholder="••••••••••••" required="" type="password" value="BukuRefleksi2024">
<button aria-label="Tampilkan atau sembunyikan kata sandi" class="absolute right-2.5 w-8 h-8 rounded-lg flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors" id="togglePasswordBtn" type="button">
<span class="material-symbols-outlined text-[20px]" id="togglePasswordIcon">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between pt-0.5">
<label class="flex items-center gap-2 cursor-pointer select-none">
<input checked="" class="sr-only peer" id="rememberMe" type="checkbox">
<div class="w-4 h-4 rounded bg-surface-container-high peer-checked:bg-secondary flex items-center justify-center transition-colors shadow-xs">
<span class="material-symbols-outlined text-on-secondary text-[14px] opacity-0 peer-checked:opacity-100 transition-opacity font-bold">check</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant">Ingat Saya</span>
</label>
<a class="font-label-md text-label-md text-secondary hover:text-on-secondary-fixed-variant transition-colors" href="#lupa-sandi">
          Lupa Kata Sandi?
        </a>
</div>
<button class="w-full mt-1 bg-primary text-on-primary py-3.5 px-5 rounded-xl font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-md shadow-primary/20 active:scale-[0.98] transition-transform group" id="submitBtn" type="submit">
<span class="">Masuk ke Akun</span>
<span class="material-symbols-outlined text-[18px] group-hover:translate-x-0.5 transition-transform">arrow_forward</span>
</button>
</form>
<div class="relative flex items-center justify-center my-5">
<div class="w-full h-px bg-surface-container-high"></div>
<span class="absolute px-3 bg-surface-container-lowest font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">
        Atau masuk dengan
      </span>
</div>
<button class="w-full bg-surface-container-low text-on-surface py-3 px-4 rounded-xl font-label-lg text-label-lg flex items-center justify-center gap-3 active:scale-[0.98] transition-transform hover:bg-surface-container" type="button">
<svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span class="">Masuk dengan Google</span>
</button>
</div>

<div class="flex items-center justify-center gap-1.5 text-center mt-1">
<span class="font-body-md text-body-md text-on-surface-variant">Belum memiliki akun Libria?</span>
<a class="font-label-lg text-label-lg text-primary underline decoration-secondary-container decoration-2 underline-offset-4 hover:text-secondary transition-colors font-semibold" href="#daftar">
      Daftar Sekarang
    </a>
</div>
</div>
<script>
  (function () {
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const toggleIcon = document.getElementById('togglePasswordIcon');
    const submitBtn = document.getElementById('submitBtn');

    if (toggleBtn && passwordInput && toggleIcon) {
      toggleBtn.addEventListener('click', function () {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    window.handleLoginSubmit = function () {
      if (!submitBtn) return;
      const originalText = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-80');
      submitBtn.innerHTML = `
        <span class="inline-block animate-spin material-symbols-outlined text-[18px]">progress_activity</span>
        <span>Membuka Pustaka...</span>
      `;
      setTimeout(function () {
        submitBtn.innerHTML = `
          <span class="material-symbols-outlined text-[18px]">check_circle</span>
          <span>Berhasil Masuk</span>
        `;
        submitBtn.classList.remove('bg-primary');
        submitBtn.classList.add('bg-secondary');
        setTimeout(function () {
          submitBtn.disabled = false;
          submitBtn.classList.remove('opacity-80', 'bg-secondary');
          submitBtn.classList.add('bg-primary');
          submitBtn.innerHTML = originalText;
        }, 1200);
      }, 900);
    };
  })();
</script></main></body></html>
