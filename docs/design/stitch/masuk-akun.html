<!DOCTYPE html><html lang="id"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Libria — Masuk</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Merriweather (Literary Serif) & Plus Jakarta Sans (Clean Modern Sans) -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            libria: {
              navy: '#0c1e33',
              deep: '#102a43',
              primary: '#1d4ed8',
              teal: '#0f766e',
              gold: '#c29b38',
              paper: '#f8fafc',
              cream: '#faf8f5',
              surface: '#ffffff',
              muted: '#627d98',
              border: '#e2e8f0'
            }
          },
          fontFamily: {
            serif: ['Merriweather', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          boxShadow: {
            'card': '0 10px 30px -5px rgba(12, 30, 51, 0.08), 0 4px 6px -2px rgba(12, 30, 51, 0.04)',
            'btn': '0 8px 20px -3px rgba(16, 42, 67, 0.28)'
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styles -->
<style data-purpose="base-styling">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f1f5f9;
      color: #0c1e33;
      -webkit-tap-highlight-color: transparent;
    }
    
    .font-literary {
      font-family: 'Merriweather', serif;
    }

    /* Subtle book page texture effect */
    .bg-paper-pattern {
      background-color: #faf9f6;
      background-image: 
        radial-gradient(at 0% 0%, rgba(240, 244, 248, 0.8) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(230, 240, 235, 0.4) 0px, transparent 40%),
        radial-gradient(at 50% 100%, rgba(248, 250, 252, 0.9) 0px, transparent 60%);
    }

    .ornament-line {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(12, 30, 51, 0.15), transparent);
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4">
<!-- BEGIN: Mobile Device Frame Simulator -->
<main class="w-full max-w-[393px] h-screen sm:h-[844px] bg-paper-pattern sm:rounded-[44px] shadow-2xl overflow-y-auto flex flex-col justify-between relative border border-slate-200/80" data-purpose="mobile-viewport">
<!-- Top Content Area -->
<div class="w-full flex flex-col">
<!-- BEGIN: iOS Status Bar -->
<header class="w-full pt-3 px-7 pb-2 flex justify-between items-center text-slate-800 text-xs font-semibold select-none z-10" data-purpose="status-bar">
<span class="">09:41</span>
<div class="flex items-center space-x-2">
<!-- Signal Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.25A10.93 10.93 0 0 1 1 12C1 5.92 5.92 1 12 1s11 4.92 11 11c0 2.33-.73 4.49-1.97 6.27l-.62-.64C21.37 16.14 22 14.16 22 12c0-4.97-4.03-9-9-9zM6 12a6 6 0 1 1 12 0 6 6 0 0 1-12 0zm3 0a3 3 0 1 1 6 0 3 3 0 0 1-6 0z"></path>
</svg>
<!-- Wifi Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A16.88 16.88 0 0 0 12 4zm0 3.5c3.6 0 6.9 1.4 9.4 3.7L12 19.3 2.6 11.2C5.1 8.9 8.4 7.5 12 7.5z"></path>
</svg>
<!-- Battery Icon -->
<div class="flex items-center space-x-0.5">
<div class="w-5 h-2.5 border border-slate-700 rounded-sm p-0.5 flex items-center">
<div class="h-full w-full bg-slate-800 rounded-2xs"></div>
</div>
<div class="w-0.5 h-1 bg-slate-700 rounded-r-xs"></div>
</div>
</div>
</header>
<!-- END: iOS Status Bar -->
<!-- BEGIN: Brand Header Section -->
<section class="px-7 pt-4 pb-2 text-center flex flex-col items-center" data-purpose="brand-header">
<!-- Logo Emblem -->
<div class="relative mb-3 group" data-purpose="brand-logo">
<div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-libria-navy to-libria-deep flex items-center justify-center shadow-lg border border-libria-navy/20 relative overflow-hidden">
<!-- Decorative interior book pages accent -->
<div class="absolute inset-0 opacity-10 bg-[radial-gradient(#ffffff_1px,transparent_1px)] [background-size:6px_6px]"></div>
<!-- Monogram Book Icon 'L' -->
<div class="flex items-center justify-center text-white">
<svg class="w-9 h-9" fill="none" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
<!-- Outer Book Spine -->
<rect fill="white" fill-opacity="0.12" height="24" rx="4" stroke="white" stroke-width="1.5" width="24" x="6" y="6"></rect>
<!-- Bold Stylized 'L' Bookmark / Letter -->
<path d="M13 11V23.5C13 24.3284 13.6716 25 14.5 25H23" stroke="#f8fafc" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path>
<!-- Teal ribbon bookmark detail -->
<path d="M19 11V18L21.5 16.5L24 18V11" fill="#2dd4bf"></path>
</svg>
</div>
</div>
<!-- Subtle Glow/Shadow Dot -->
<div class="w-8 h-1 bg-libria-teal/30 mx-auto rounded-full blur-xs mt-1"></div>
</div>
<!-- Typography: Merriweather Title -->
<h1 class="text-3xl font-literary font-bold tracking-tight text-libria-navy mb-1.5">
          Libria
        </h1>
<!-- Elegant Subtitle & Literary Quote -->
<p class="text-xs uppercase tracking-widest font-semibold text-libria-teal mb-1">
          Perpustakaan Digital Pribadi
        </p>
<p class="text-xs text-libria-muted leading-relaxed max-w-[270px]">
          Selamat datang kembali. Masuk untuk melanjutkan petualangan membacamu.
        </p>
<!-- Delicate Book Spine Separator -->
<div class="w-16 ornament-line mt-3 mb-1"></div>
</section>
<!-- END: Brand Header Section -->
<!-- BEGIN: Authentication Form -->
<section class="px-7 pt-2 pb-3" data-purpose="login-form-container">
<form class="space-y-3.5" data-purpose="interactive-login-form" onsubmit="event.preventDefault();">
<!-- Input Field: Email -->
<div data-purpose="email-field-group">
<label class="block text-xs font-semibold text-libria-navy mb-1.5 ml-1" for="email">
              Email atau ID Anggota
            </label>
<div class="relative flex items-center">
<span class="absolute left-3.5 text-libria-muted pointer-events-none">
<!-- Mail Icon -->
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</span>
<input class="w-full pl-10 pr-3.5 py-2.5 text-sm rounded-xl border border-slate-200 bg-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-libria-deep/20 focus:border-libria-deep transition shadow-xs text-libria-navy font-normal" id="email" name="email" placeholder="nama@email.com" required="" type="email">
</div>
</div>
<!-- Input Field: Kata Sandi -->
<div data-purpose="password-field-group">
<label class="block text-xs font-semibold text-libria-navy mb-1.5 ml-1" for="password">
              Kata Sandi
            </label>
<div class="relative flex items-center">
<span class="absolute left-3.5 text-libria-muted pointer-events-none">
<!-- Lock Icon -->
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</span>
<input class="w-full pl-10 pr-10 py-2.5 text-sm rounded-xl border border-slate-200 bg-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-libria-deep/20 focus:border-libria-deep transition shadow-xs text-libria-navy" id="password" name="password" placeholder="••••••••" required="" type="password">
<!-- Toggle Visibility Button -->
<button aria-label="Lihat kata sandi" class="absolute right-3 text-libria-muted hover:text-libria-navy p-1 transition" id="togglePassword" type="button">
<!-- Eye Icon -->
<svg class="w-4 h-4" fill="none" id="eyeIcon" stroke="currentColor" viewBox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</button>
</div>
</div>
<!-- Utilities Row: Remember Me & Forgot Password -->
<div class="flex items-center justify-between text-xs pt-0.5 px-0.5">
<label class="flex items-center space-x-2 cursor-pointer select-none">
<input checked="" class="w-4 h-4 rounded text-libria-navy border-slate-300 focus:ring-libria-navy/20 cursor-pointer" type="checkbox">
<span class="text-libria-muted font-medium">Ingat Saya</span>
</label>
<a class="font-semibold text-libria-teal hover:text-teal-800 transition" href="#">
              Lupa Password?
            </a>
</div>
<!-- Submit CTA Button -->
<div class="pt-2">
<button class="w-full bg-[#1b44c8] hover:bg-[#1638aa] active:scale-[0.99] text-white font-semibold py-3 px-4 rounded-xl shadow-btn transition duration-150 flex items-center justify-center space-x-2 text-sm" data-purpose="submit-login-button" type="submit">
<span class="">MASUK</span>
<svg class="w-4 h-4 text-white/80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</form>
<!-- BEGIN: Social Divider -->
<div class="relative my-4 flex items-center justify-center" data-purpose="alternative-auth-divider">
<div class="w-full border-t border-slate-200"></div>
<span class="absolute bg-[#faf9f6] px-3 text-[11px] text-libria-muted font-normal tracking-wide">
            Atau masuk dengan:
          </span>
</div>
<!-- END: Social Divider -->
<!-- BEGIN: Social Login Options -->
<div class="px-1" data-purpose="social-auth-buttons"><button aria-label="Masuk dengan Google" class="w-full flex items-center justify-center space-x-2.5 py-2.5 px-4 rounded-xl bg-white border border-slate-200 hover:border-slate-300 hover:bg-slate-50 active:scale-[0.99] transition shadow-xs text-sm font-medium text-slate-700" type="button"><svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24"><path d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z" fill="#EA4335"></path><path d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z" fill="#4285F4"></path><path d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.8s.2-2.1.4-2.8L1.9 6.3C.7 8.7 0 10.3 0 12s.7 3.3 1.9 5.7l3.7-2.9z" fill="#FBBC05"></path><path d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z" fill="#34A853"></path></svg><span class="">Masuk dengan Google</span></button></div>
<!-- END: Social Login Options -->
</section>
<!-- END: Authentication Form -->
</div>
<!-- BEGIN: Bottom Footer & Navigation -->
<div class="w-full flex flex-col items-center pb-2 bg-gradient-to-t from-white via-white/80 to-transparent pt-3" data-purpose="bottom-layout">
<!-- Register Suggestion Link -->
<div class="text-xs text-slate-600 mb-3 text-center">
        Belum punya akun? 
        <a class="font-bold text-[#1b44c8] hover:underline ml-1" href="#">
          Daftar
        </a>
</div>
<!-- Compact Tab Bar (Mirroring app bottom bar in Libria UI) -->
<nav class="w-full border-t border-slate-200/80 px-6 py-2 flex justify-between items-center text-[10px] text-slate-500 bg-white/95" data-purpose="app-tab-bar">
<!-- Beranda -->
<a class="flex flex-col items-center space-y-1 hover:text-libria-navy transition" href="#">
<svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24">
<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"></path>
</svg>
<span class="">Beranda</span>
</a>
<!-- Buku -->
<a class="flex flex-col items-center space-y-1 hover:text-libria-navy transition" href="#">
<svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24">
<path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"></path>
</svg>
<span class="">Buku</span>
</a>
<!-- Pengaturan -->
<a class="flex flex-col items-center space-y-1 hover:text-libria-navy transition" href="#">
<svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24">
<path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"></path>
</svg>
<span class="">Pengaturan</span>
</a>
<!-- Profil (Active indicator) -->
<a class="flex flex-col items-center space-y-1 text-libria-navy font-semibold" href="#">
<svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"></path>
</svg>
<span class="">Profil</span>
</a>
</nav>
<!-- Home Indicator Line for iOS -->
<div class="w-32 h-1 bg-slate-300 rounded-full mt-2"></div>
</div>
<!-- END: Bottom Footer & Navigation -->
</main>
<!-- END: Mobile Device Frame Simulator -->
<!-- BEGIN: Interactive Script for Password Visibility Toggle -->
<script data-purpose="password-toggle-behavior">
    document.addEventListener('DOMContentLoaded', function() {
      const toggleBtn = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');
      
      if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', function() {
          const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
          passwordInput.setAttribute('type', type);
          
          // Switch opacity or style indicator
          toggleBtn.classList.toggle('text-libria-navy');
          toggleBtn.classList.toggle('text-libria-muted');
        });
      }
    });
  </script>
<!-- END: Interactive Script -->


</body></html>
